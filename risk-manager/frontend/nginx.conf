server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback — React Router client-side routes.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Same-origin API proxy to the backend service. Keeps the browser flow
  # identical to local dev (Vite proxy) — no CORS needed inside compose.
  location /api/ {
    proxy_pass http://backend:3001;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Webhook route needs the raw body preserved for HMAC verification.
    proxy_request_buffering off;
  }
}

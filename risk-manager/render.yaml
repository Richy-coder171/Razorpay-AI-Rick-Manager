# Render Blueprint — Risk Manager backend (Track 02 demo).
#
# Deploy: push this repo to GitHub, then Render Dashboard → New → Blueprint →
# select the repo. Render reads this file and provisions the backend service.
#
# Requirements it sets:
#  - Long-running Express server (not serverless) — Render Web Service.
#  - DB_DRIVER=mongo against MongoDB Atlas free tier (set MONGODB_URI in the
#    Render dashboard after creating the Atlas cluster; do NOT commit it).
#  - The hash-chained audit log must persist across deploys — hence a real
#    database, not the container filesystem.
services:
  - type: web
    name: risk-manager-backend
    runtime: node
    plan: free
    region: oregon
    # --include=dev: NODE_ENV=production (runtime env var) also applies to the
    # build, which would otherwise skip devDependencies (@types/*, tsc) and
    # break compilation. The final cp mirrors the Dockerfile: tsc does not
    # emit JSON, and the server reads dist/policy/policy.config.json at boot.
    buildCommand: cd shared && npm install --include=dev && npm run build && cd ../backend && npm install --include=dev && npm run build && cp src/policy/policy.config.json dist/policy/policy.config.json
    startCommand: cd backend && node dist/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: DB_DRIVER
        value: mongo
      # Set in the Render dashboard (secret): mongodb+srv://… Atlas free-tier URI
      - key: MONGODB_URI
        sync: false
      # LLM provider: unset/empty = mock (safe default). Set to "gemini" with
      # GEMINI_API_KEY for the real LLM path (always behind the Agent Output
      # Guard; falls back to mock on any failure).
      - key: LLM_PROVIDER
        sync: false
      # Optional (secret): Google AI Studio key enabling the real Gemini path
      - key: GEMINI_API_KEY
        sync: false
      - key: PAYMENT_PROVIDER
        value: mock
      - key: DEMO_API_KEY
        value: demo-key
      - key: REQUIRE_API_KEY
        value: "true"
      # Set in the dashboard to your Vercel frontend URL(s), comma-separated.
      - key: CORS_ORIGINS
        sync: false
      - key: DETECTOR_TIMEOUT_MS
        value: "5000"
      - key: LLM_TIMEOUT_MS
        value: "15000"
